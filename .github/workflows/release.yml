name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed APKs and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.12 --distribution-type bin
          fi

      # If RELEASE_KEYSTORE_BASE64 secret is set, decode it and build a signed release.
      # Otherwise fall back to :assembleDebug so tags still produce installable APKs.
      - name: Decode keystore (if provided)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APKs
        if: steps.keystore.outputs.signed == 'true'
        env:
          JELLYFLIX_KEYSTORE: ${{ steps.keystore.outputs.path }}
          JELLYFLIX_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          JELLYFLIX_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          JELLYFLIX_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :sample-plugin:assembleRelease --no-daemon --stacktrace

      - name: Build unsigned (debug) APKs fallback
        if: steps.keystore.outputs.signed == 'false'
        run: ./gradlew :app:assembleDebug :sample-plugin:assembleDebug --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          shopt -s nullglob
          cp app/build/outputs/apk/release/*.apk              dist/ 2>/dev/null || true
          cp sample-plugin/build/outputs/apk/release/*.apk    dist/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk                dist/ 2>/dev/null || true
          cp sample-plugin/build/outputs/apk/debug/*.apk      dist/ 2>/dev/null || true
          ls -la dist/

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Jellyflix ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          generate_release_notes: true
          body: |
            **Install on Android TV / Google TV**

            1. Enable Developer options → ADB debugging on your TV.
            2. `adb connect <tv-ip>:5555`
            3. `adb install jellyflix-app-*.apk`
            4. (Optional) Install `jellyflix-sample-plugin-*.apk` for the reference plugin.

            If you don't have `adb`, sideload via a file manager (Send files to TV, X-plore, etc.) from a USB drive.

            ${{ steps.keystore.outputs.signed == 'false' && '> _Built with the debug keystore — installs fine on any TV, but updates between builds require uninstall first._' || '' }}
          files: dist/*.apk
