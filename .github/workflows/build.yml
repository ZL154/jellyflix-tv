name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.12 --distribution-type bin
          fi

      - name: Assemble app debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble sample-plugin debug APK
        run: ./gradlew :sample-plugin:assembleDebug --no-daemon --stacktrace

      - name: Upload app APK
        uses: actions/upload-artifact@v4
        with:
          name: jellyflix-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload sample-plugin APK
        uses: actions/upload-artifact@v4
        with:
          name: jellyflix-sample-plugin-debug
          path: sample-plugin/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
